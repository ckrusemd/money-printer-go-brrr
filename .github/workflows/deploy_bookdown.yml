name: Build and deploy Money Printer Go BRRR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "book.bib"
      - "packages.bib"
      - "index.Rmd"
      - ".github/workflows/deploy_bookdown.yml"
  schedule:
    - cron: "3 0 * * *"

permissions:
  contents: read

concurrency:
  group: money-printer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/ckrusemd/money-printer-go-brrr-r:latest
      options: --user root
    env:
      FRED_API: ${{ secrets.FRED_API }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
      - name: Validate R sources
        run: Rscript --vanilla -e 'parse(file = "money_theme.R")'
      - name: Render Bookdown site
        run: Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_book")'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
