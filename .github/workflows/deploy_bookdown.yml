name: Build and deploy Money Printer Go BRRR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.R"
      - "**.Rmd"
      - "_bookdown.yml"
      - "book.bib"
      - "packages.bib"
      - "index.Rmd"
      - ".github/workflows/deploy_bookdown.yml"
  schedule:
    # 04:00 CET = 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: money-printer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The full Bookdown render regularly exceeds 20 minutes on ubuntu-latest.
    # Leave enough headroom for the scheduled run to finish and upload the site.
    timeout-minutes: 45
    container:
      image: ghcr.io/ckrusemd/money-printer-go-brrr-r:latest
      options: --user root
    env:
      FRED_API: ${{ secrets.FRED_API }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
      - name: Validate R sources
        run: Rscript --vanilla -e 'parse(file = "money_theme.R")'
      - name: Render Bookdown site
        run: |
          start_time=$(date +%s)
          Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_book")'
          elapsed=$(( $(date +%s) - start_time ))
          echo "Pages render duration: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate Pages artifact size
        run: |
          site_bytes=$(du -sb _book | cut -f1)
          site_megabytes=$((site_bytes / 1024 / 1024))
          echo "Pages artifact size: ${site_megabytes} MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$site_bytes" -lt 943718400
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _book
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
