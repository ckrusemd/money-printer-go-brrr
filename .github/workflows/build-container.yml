name: Build R publication container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - renv.lock
      - renv/settings.json
      - renv/activate.R
      - .Rprofile
      - .github/workflows/build-container.yml

permissions:
  contents: read

concurrency:
  group: publication-container
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ckrusemd/money-printer-go-brrr-r

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=money-printer-r
          cache-to: type=gha,mode=max,scope=money-printer-r
      - name: Smoke test published image
        run: >-
          docker run --rm
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          Rscript --vanilla -e 'stopifnot(requireNamespace("rmarkdown", quietly = TRUE), requireNamespace("fredr", quietly = TRUE))'
      - name: Verify Quarto is available
        run: docker run --rm ${{ env.IMAGE_NAME }}:${{ github.sha }} quarto --version
