name: Build R publication container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - renv.lock
      - renv/settings.json
      - renv/activate.R
      - .Rprofile
      - .github/workflows/build-container.yml

permissions:
  contents: read

concurrency:
  group: publication-container
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ckrusemd/money-printer-go-brrr-r

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=money-printer-r
          cache-to: type=gha,mode=max,scope=money-printer-r
      - name: Smoke test published image
        run: >-
          docker run --rm
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          Rscript --vanilla -e 'stopifnot(requireNamespace("bookdown", quietly = TRUE), requireNamespace("fredr", quietly = TRUE))'
