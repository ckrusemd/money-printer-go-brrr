name: Build and deploy Money Printer Go BRRR

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build R publication container"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "**.R"
      - "**.Rmd"
      - "data/positivliste_2026.csv"
      - "data/investment_products_2026.csv"
      - "_bookdown.yml"
      - "book.bib"
      - "packages.bib"
      - "index.Rmd"
      - ".github/workflows/deploy_bookdown.yml"
  schedule:
    # 04:00 CET = 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: money-printer-pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # External data retrieval and the full Bookdown render can exceed 45 minutes.
    # Leave sufficient headroom for a complete scheduled build and Pages upload.
    timeout-minutes: 90
    container:
      image: ${{ github.event_name == 'workflow_run' && format('ghcr.io/ckrusemd/money-printer-go-brrr-r:{0}', github.event.workflow_run.head_sha) || 'ghcr.io/ckrusemd/money-printer-go-brrr-r:latest' }}
      options: --user root
    env:
      FRED_API: ${{ secrets.FRED_API }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Check repository configuration
        run: |
          test -f renv.lock
          test -f _bookdown.yml
          test -f index.Rmd
          test -n "$FRED_API"
      - name: Verify render dependencies
        run: >-
          Rscript --vanilla -e
          'stopifnot(requireNamespace("bookdown", quietly = TRUE), requireNamespace("rmarkdown", quietly = TRUE), requireNamespace("fredr", quietly = TRUE), requireNamespace("dkstat", quietly = TRUE))'
      - name: Validate R sources
        run: Rscript --vanilla -e 'parse(file = "money_theme.R")'
      - name: Render Bookdown site
        shell: bash
        run: |
          start_time=$(date +%s)
          set -o pipefail
          Rscript --vanilla -e 'bookdown::render_book("index.Rmd", output_dir = "_book")' 2>&1 | tee "$GITHUB_WORKSPACE/render.log"
          elapsed=$(( $(date +%s) - start_time ))
          echo "Pages render duration: ${elapsed}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload failed render log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bookdown-render-log
          path: ${{ github.workspace }}/render.log
          if-no-files-found: warn
          retention-days: 7
      - name: Check rendered book
        run: Rscript --vanilla scripts/check_bookdown_output.R
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _book
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
