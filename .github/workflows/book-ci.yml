name: Offline book and dashboard checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Python sources and all no-secret tests
        run: |
          python3 -m compileall -q scripts tests knowledgegraph/app
          python3 scripts/sync_book_notebooks.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check publication lock is an approved identical-record subset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def validate_publication_lock(root, publication):
              # Live/replay and minimal-image evidence approves only these six.
              approved_omissions = {"IRdisplay", "IRkernel", "pacman", "pbdZMQ", "repr", "uuid"}
              if publication["R"] != root["R"]:
                  raise ValueError("Publication R metadata differs from root lock")
              original = root["Packages"]
              retained = publication["Packages"]
              extra = set(retained) - set(original)
              if extra:
                  raise ValueError("Extra publication records: " + ", ".join(sorted(extra)))
              omitted = set(original) - set(retained)
              unapproved = omitted - approved_omissions
              if unapproved:
                  raise ValueError("Unapproved publication omissions: " + ", ".join(sorted(unapproved)))
              changed = {name for name in retained if retained[name] != original[name]}
              if changed:
                  raise ValueError("Changed publication records: " + ", ".join(sorted(changed)))
              return omitted

          root = json.loads(Path("renv.lock").read_text())
          publication = json.loads(Path("renv/publication.lock").read_text())
          omitted = validate_publication_lock(root, publication)
          print(f"Preserved {len(publication['Packages'])} identical root records; approved omissions: {', '.join(sorted(omitted))}")
          PY
      - name: Parse sources and discover every R fixture without network
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/ckrusemd/money-printer-go-brrr-r:latest
          docker run --rm --network none --read-only --tmpfs /tmp \
            --entrypoint /bin/bash -v "$GITHUB_WORKSPACE:/project:ro" -w /project \
            ghcr.io/ckrusemd/money-printer-go-brrr-r:latest -euo pipefail -c '
              Rscript --vanilla scripts/check_sources.R
              Rscript --vanilla scripts/check_publication_dependencies.R
              Rscript --vanilla scripts/check_publication_closure.R
              tests=(tests/test_*.R)
              test -f "${tests[0]}"
              for fixture in "${tests[@]}"; do
                Rscript --vanilla "$fixture"
              done
              python3 -B -m unittest tests.test_research_paths
            '

      - name: Run market reader fixtures and reject skipped tests
        shell: bash
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp \
            --entrypoint python3 -v "$GITHUB_WORKSPACE:/project:ro" -w /project \
            ghcr.io/ckrusemd/money-printer-go-brrr-r:latest -B - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_reader_output.MarketReaderFixtures")
          assert suite.countTestCases() > 0, "No market reader fixtures discovered"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY

  dashboard-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Python 3.11 for the pinned dashboard wheels
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: knowledgegraph/app/requirements.txt
      - name: Install existing dashboard requirements
        run: python -m pip install -r knowledgegraph/app/requirements.txt
      - name: Run dashboard fixtures and reject skipped tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          import dash, plotly, pandas, numpy, duckdb, networkx, scipy, sklearn
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_dashboard.py")
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName("tests.test_research_paths.GraphNotebookFixtureTests"))
          assert suite.countTestCases() > 0, "No dashboard tests discovered"
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY
