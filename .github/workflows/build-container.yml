name: Build R publication container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - renv.lock
      - renv/publication.lock
      - renv/settings.json
      - renv/activate.R
      - .Rprofile
      - .github/workflows/build-container.yml
      - scripts/publication_image_key.py
      - scripts/notebooks/requirements.lock

permissions:
  contents: read

concurrency:
  group: publication-container
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ckrusemd/money-printer-go-brrr-r

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Fingerprint the publication Docker context
        id: context
        run: echo "digest=$(python3 scripts/publication_image_key.py)" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          build-args: PUBLICATION_CONTEXT=${{ steps.context.outputs.digest }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:context-${{ steps.context.outputs.digest }}
          cache-from: type=gha,scope=money-printer-r
          cache-to: type=gha,mode=max,scope=money-printer-r
      - name: Smoke test published image
        run: >-
          docker run --rm --network none --workdir /tmp
          --entrypoint Rscript ${{ env.IMAGE_NAME }}:${{ github.sha }}
          --vanilla -e 'stopifnot(as.character(getRversion()) == "4.6.1", requireNamespace("bookdown", quietly = TRUE), requireNamespace("rmarkdown", quietly = TRUE), requireNamespace("fredr", quietly = TRUE), requireNamespace("dkstat", quietly = TRUE), rmarkdown::pandoc_version() >= package_version("2.11"))'

      - name: Smoke test R notebook execution and widget rendering
        run: |
          mkdir -p "$RUNNER_TEMP/notebook-smoke"
          docker run --rm --network none --entrypoint python3 \
            -v "$GITHUB_WORKSPACE:/project:ro" -v "$RUNNER_TEMP/notebook-smoke:/evidence" -w /project \
            ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }} -m scripts.notebooks.smoke --output /evidence
      - name: Check widget interactions in Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/notebook-browser"
          "$RUNNER_TEMP/notebook-browser/bin/pip" install playwright==1.64.1
          "$RUNNER_TEMP/notebook-browser/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/notebook-browser/bin/python" -m scripts.notebooks.browser_smoke "$RUNNER_TEMP/notebook-smoke"
      - name: Verify notebook execution as the VS Code user
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --user notebook \
            --entrypoint python3 -v "$GITHUB_WORKSPACE:/project:ro" -w /project \
            ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }} -B -m scripts.notebooks.smoke
      - name: Record immutable image for promotion
        run: |
          echo 'Validated image: ${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pin this digest with python -m scripts.notebooks.image pin IMAGE@sha256:DIGEST, then commit the devcontainer configuration.' >> "$GITHUB_STEP_SUMMARY"
