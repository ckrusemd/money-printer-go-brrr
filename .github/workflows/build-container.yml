name: Build R publication container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - renv.lock
      - renv/settings.json
      - renv/activate.R
      - .Rprofile
      - .github/workflows/build-container.yml

permissions:
  contents: read

concurrency:
  group: publication-container
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ckrusemd/money-printer-go-brrr-r

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=money-printer-r
          cache-to: type=gha,mode=max,scope=money-printer-r
      - name: Smoke test published image
        run: >-
          docker run --rm
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          Rscript --vanilla -e 'stopifnot(as.character(getRversion()) == "4.3.3", requireNamespace("bookdown", quietly = TRUE), requireNamespace("rmarkdown", quietly = TRUE), requireNamespace("fredr", quietly = TRUE), requireNamespace("dkstat", quietly = TRUE), rmarkdown::pandoc_version() >= package_version("2.11"))'
